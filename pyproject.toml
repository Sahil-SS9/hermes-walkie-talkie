[project]
name = "hermes-walkie-talkie"
version = "0.1.0rc1"
description = "Same-machine, cross-session agent messaging for AI harnesses — Hermes first."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Sahil Saghir" }]
keywords = ["agent", "messaging", "hermes", "ipc", "unix-socket", "peer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
]
# The core has zero runtime dependencies by design (ADR-0001). Hermes itself
# provides the host APIs used by hermes_peer at runtime; the plugin is loaded
# inside a Hermes process, so no dependency is declared here.
dependencies = []

[project.optional-dependencies]
# Native Windows named-pipe backend (ADR-0005 Candidate 2): explicit
# SID-bound DACL. Only needed on Windows; Linux/macOS remain dependency-light.
windows = ["pywin32==310; sys_platform == 'win32'"]

[project.entry-points."hermes_agent.plugins"]
hermes-peer = "hermes_peer.plugin:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_peer", "hermes_peer", "dashboard"]

[tool.setuptools.package-data]
hermes_peer = ["../plugin.yaml", "assets/desktop/*.js", "assets/desktop/*.css"]
agent_peer = ["py.typed"]
dashboard = ["manifest.json", "plugin_api.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests that spawn real subprocesses",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ty]
# Type checking configuration for `ty check agent_peer hermes_peer`.
# Python version is inferred from project.requires-python (>=3.11).

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.135.3",
    "pytest-cov==6.2.1",
    "ruff==0.12.10",
    "ty==0.0.2",
    # Dashboard plugin tests exercise the FastAPI router (runtime gets it
    # from the Hermes core host).
    "fastapi==0.115.6",
    "httpx==0.27.2",
    "pytest-asyncio==0.24.0",
    "websockets==14.1",
]
